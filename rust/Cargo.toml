[package]
name = "seven_days_backup"
version = "1.1.0"
edition = "2021"
description = "7 Days to Die 存档自动备份工具（Rust 原生版）"

[[bin]]
name = "7DaysBackup"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
winreg = "0.52"
sysinfo = "0.32"
fs2 = "0.4"
walkdir = "2"
rfd = "0.15"
notify-rust = "4"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
